# wrangler.toml en la RAIZ del repo.
# Lo usa el build de Cloudflare cuando ejecuta `npx wrangler deploy` desde la raiz.
name = "musgoesp32"
main = "musgo_astro/worker/index.js"
compatibility_date = "2024-11-01"

account_id = "dac9003257ad1248eac7396e1715b05c"

# Durable Object: estado global consistente para la telemetria en vivo.
[[durable_objects.bindings]]
name = "MUSGO"
class_name = "MusgoState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MusgoState"]
